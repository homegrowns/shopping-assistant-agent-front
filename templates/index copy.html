<html>

<head>
    <title>{{ title }}</title>
    <link href="https://unpkg.com/mvp.css" rel="stylesheet" />
    <style>
        .upload-area {
            border: 2px dashed #ccc;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #888;
        }

        .preview-img {
            max-width: 200px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <header>
        <h1>AI 쇼퍼</h1>
    </header>
    <center>
        <!-- 기존 RAG 텍스트 검색 (FastAPI /query) -->
        <form action="/query" method="get">
            <input type="search" placeholder="질문을 입력하세요" name="s" />
            <button type="submit">검색</button>
        </form>

        <hr />

        <!-- 이미지 업로드 (S3 Presigned URL) -->
        <h3>📷 이미지로 검색</h3>
        <label for="imageInput" class="upload-area" id="uploadArea">
            이미지를 선택하세요
        </label>
        <input type="file" id="imageInput" accept="image/*" style="display:none" />
        <br />
        <img id="preview" class="preview-img" style="display:none" />
        <br />
        <input type="text" id="imageText" placeholder="이런 nike옷 찾아줘 (선택사항)" style="width:300px" />
        <br />
        <button id="imageSearchBtn" disabled>이미지 검색</button>
        <div id="status"></div>
    </center>
    <main>
        {{ answer }}
    </main>

    <script>
        // ─── 설정 ───
        const API_BASE = 'https://70crv2wl9a.execute-api.ap-northeast-2.amazonaws.com/dev';

        // ─── DOM 요소 ───
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const uploadArea = document.getElementById('uploadArea');
        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('searchInput');
        const statusDiv = document.getElementById('status');
        const answerDiv = document.getElementById('answer');

        // ─── 채팅 세션 상태 ───
        let currentSessionId = null;

        // ─── 이미지 선택 시 미리보기 ───
        imageInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
                uploadArea.textContent = '✅ ' + file.name;
            }
        });

        // ─── 검색 버튼 클릭 ───
        searchBtn.addEventListener('click', async function () {
            const file = imageInput.files[0];
            const text = searchInput.value;

            // 이미지도 텍스트도 없으면 리턴
            if (!file && !text) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '이미지 또는 텍스트를 입력해주세요.';
                return;
            }

            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ 처리 중...';

            try {
                let s3_key = null;

                // ─── 이미지가 있으면 S3에 업로드 ───
                if (file) {
                    // 1. Lambda에서 Presigned URL 받기
                    statusDiv.className = 'status';
                    statusDiv.textContent = '📤 Presigned URL 발급 중...';

                    const presignRes = await fetch(API_BASE + '/products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content_type: file.type,
                            session_id: currentSessionId // 진행 중인 세션이 있다면 같이 보냄
                        })
                    });
                    const presignData = await presignRes.json();

                    // 첫 업로드여서 세션 ID를 새로 발급받았다면 저장해둠
                    if (!currentSessionId && presignData.session_id) {
                        currentSessionId = presignData.session_id;
                        console.log('새로운 세션이 시작되었습니다:', currentSessionId);
                    }

                    // 2. S3에 직접 업로드
                    statusDiv.textContent = '📤 S3에 이미지 업로드 중...';

                    await fetch(presignData.presigned_url, {
                        method: 'PUT',
                        headers: { 'Content-Type': file.type },
                        body: file
                    });

                    s3_key = presignData.s3_key;
                    statusDiv.className = 'status success';
                    statusDiv.textContent = '✅ 이미지 업로드 완료!';
                }

                // ─── 채팅 API 호출 (Fargate) ───
                statusDiv.textContent = '🔍 검색 중...';

                const chatRes = await fetch(API_BASE + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        currentSessionId: currentSessionId,
                        s3_key: s3_key  // 이미지 없으면 null
                    })
                });
                const chatData = await chatRes.json();

                // 결과 표시
                answerDiv.innerHTML = chatData.answer || chatData.result || JSON.stringify(chatData);
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ 검색 완료!';

            } catch (err) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ 오류: ' + err.message;
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '검색';
            }
        });

        // ─── Enter 키로도 검색 ───
        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });
    </script>
</body>

</html>
